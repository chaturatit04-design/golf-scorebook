<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6a43">
<title>ParLive</title>
<meta name="apple-mobile-web-app-title" content="ParLive">
<meta name="application-name" content="ParLive">
<meta name="description" content="ParLive · สกอร์กอล์ฟสด ก๊วน นัดออกรอบ และห้องเชียร์">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one narrow column like a scorecard in a back pocket; the hole screen is the hero: hole map on top, big thumb-sized steppers below */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --ink:#16251b; --muted:#5b6a5f; --line:#d3dbcd;
  --accent:#1d6a43; --accent-ink:#ffffff; --under:#b8372b; --over:#35588c; --soft:#e2e9dc;
  --rough:#8fb27a; --fw:#b5d69a; --grn:#cfe8b4; --sand:#ead9a8; --teebox:#7da268;
  --trace:#ffffff; --trace-edge:rgba(10,20,14,.6); --shot:#f2c230; --shot-ink:#16251b; --scrim:rgba(251,252,248,.82);
  --eagle:#0d5a31; --birdie:#2b8c50; --bogey:#c45f0a; --dbl:#c42f24; --bogey-bg:#fbe9d8; --birdie-bg:#dcefe2;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece5; --muted:#98a79b; --line:#2b3a30;
  --accent:#4dab78; --accent-ink:#0b130e; --under:#ec6f62; --over:#86a9de; --soft:#1d2a22;
  --rough:#2f4a2c; --fw:#3f6337; --grn:#4f7a42; --sand:#8a7a4e; --teebox:#3a5a33; --scrim:rgba(14,21,17,.8); --eagle:#3fbf73; --birdie:#8fe0ae; --bogey:#f29a4a; --dbl:#ff6b5c; --bogey-bg:#3a2516; --birdie-bg:#173322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece5; --muted:#98a79b; --line:#2b3a30;
  --accent:#4dab78; --accent-ink:#0b130e; --under:#ec6f62; --over:#86a9de; --soft:#1d2a22;
  --rough:#2f4a2c; --fw:#3f6337; --grn:#4f7a42; --sand:#8a7a4e; --teebox:#3a5a33; --scrim:rgba(14,21,17,.8); --eagle:#3fbf73; --birdie:#8fe0ae; --bogey:#f29a4a; --dbl:#ff6b5c; --bogey-bg:#3a2516; --birdie-bg:#173322; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--under);border-color:var(--under)}
.btn.full{width:100%;padding:14px;font-size:1.02rem}
.btn.sm{padding:7px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-num);font-size:1.5rem;font-weight:600}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-family:var(--f-num);font-weight:600;font-size:.85rem;padding:2px 8px;border-radius:999px;background:var(--soft);min-width:44px;text-align:center}
.badge.u{color:var(--birdie);background:var(--birdie-bg)} .badge.o{color:var(--bogey);background:var(--bogey-bg)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty svg{width:72px;height:72px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:11px 6px;font-weight:600;min-width:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pars{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.pars button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 0;display:flex;flex-direction:column;align-items:center}
.pars .h{font-size:.68rem;color:var(--muted)}
.pars .p{font-family:var(--f-num);font-weight:600;font-size:1.05rem}
/* play */
.holebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.holebar button{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-num);font-size:.85rem}
.holebar button.done{background:var(--soft)}
.holebar button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.holehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.holehead .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
.parpick{display:flex;align-items:center;gap:6px}
.parpick button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-num);font-weight:600}
.parpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px}
.stepper button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.8rem;font-weight:600;line-height:1}
.stepper .val{text-align:center;display:flex;flex-direction:column;align-items:center}
.stepper .val .n{font-family:var(--f-num);font-size:2.4rem;font-weight:600;line-height:1.1}
.stepper.sm{grid-template-columns:52px 1fr 52px}
.stepper.sm button{height:52px;font-size:1.4rem}
.stepper.sm .val .n{font-size:1.7rem}
.rel{font-size:.85rem;font-weight:600}
.u{color:var(--birdie)} .o{color:var(--bogey)}
.sc-e{color:var(--eagle)} .sc-b{color:var(--birdie)} .sc-p{color:var(--ink)} .sc-bo{color:var(--bogey)} .sc-db{color:var(--dbl)}
.totals{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--ink);color:var(--bg);border-radius:12px}
.totals .num{font-size:1.2rem}
.saved{font-size:.75rem;color:var(--muted);text-align:right;min-height:1.2em}
/* hole map */
.map{position:relative;width:100%;max-width:440px;margin-inline:auto;border-radius:12px;overflow:hidden;background:var(--rough);touch-action:manipulation}
.map::before{content:"";display:block;padding-top:calc(100% / var(--ar))}
.map.tap{cursor:crosshair}
.map img,.map svg,.map .layer{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.map img{object-fit:fill;user-select:none;-webkit-user-drag:none}
.map .imgerr{position:absolute;left:8px;right:8px;top:8px;padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--under);font-size:.8rem;text-align:center}
.map .lock{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;background:var(--scrim);color:var(--ink);font-weight:600}
.flag.ready{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){.flag.ready{animation:wave 1.1s ease-in-out infinite}}
@keyframes wave{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.hint{font-size:.88rem;font-weight:600;color:var(--accent);text-align:center}
.shots{display:flex;flex-direction:column}
.shot{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shot:last-child{border-bottom:0}
.shot .dot{width:26px;height:26px;border-radius:50%;background:var(--shot);color:var(--shot-ink);font-family:var(--f-num);font-weight:600;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.shot .d{font-family:var(--f-num);font-size:.85rem;text-align:right;white-space:nowrap}
.ydrow{display:flex;gap:10px;align-items:center}
.ydrow input{font:inherit;width:100px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thumb{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:.78rem;color:var(--muted);min-width:0}
.thumb .map{width:100%;border-radius:8px}
/* scorecard */
.cardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sc{border-collapse:collapse;font-family:var(--f-num);font-size:.82rem;min-width:100%}
.sc th,.sc td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;min-width:32px}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:10px;font-family:var(--f-body);font-weight:600;position:sticky;left:0;background:var(--surface);min-width:62px}
.sc tr:last-child td{border-bottom:0}
.sc .sum{background:var(--soft);font-weight:600}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-weight:600}
.mk.b{border:1.5px solid var(--birdie);border-radius:50%;color:var(--birdie)}
.mk.e{border:1.5px solid var(--eagle);border-radius:50%;color:var(--eagle);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--eagle)}
.mk.bo{border:1.5px solid var(--bogey);color:var(--bogey)}
.mk.db{border:1.5px solid var(--dbl);color:var(--dbl);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--dbl)}
.hz{display:inline-block;font-size:.66rem;font-weight:600;line-height:1.25;color:var(--bogey)}
.thumb .lab{font-weight:600;font-size:.8rem}
/* analysis */
.an{display:flex;flex-direction:column;gap:10px}
.an-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:1rem}
.an-h i{width:10px;height:10px;border-radius:50%;display:inline-block}
.an-item{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.an-item .t{font-weight:600}
.an-item .m{font-family:var(--f-num);font-size:.82rem;color:var(--muted)}
.an-item .dr{font-size:.88rem}
.an-item .dr b{font-weight:600}
.an-item.good{border-left:3px solid var(--birdie)}
.an-item.bad{border-left:3px solid var(--bogey)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .mk{width:18px;height:18px;font-size:.6rem}
.chart svg{width:100%;height:auto;display:block}
.notice{font-size:.85rem;padding:10px 12px;border-radius:10px;background:var(--soft)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--under);border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.stepper button:active,.btn:active{transform:scale(.97)}}
/* group */
.gbtn{display:flex;flex-direction:column;align-items:center;gap:2px}
.codein{font-family:var(--f-num);font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;flex:1 1 140px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:8px;align-items:center}
.prow input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline}
.gp{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.gp.conflict{border-color:var(--dbl);box-shadow:inset 3px 0 0 var(--dbl)}
.gp.ok{box-shadow:inset 3px 0 0 var(--birdie)}
.gp.pending{box-shadow:inset 3px 0 0 var(--shot)}
.gpn{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gpn .t{font-weight:600}
.gval{border:0!important;background:none!important;height:auto!important;font-size:inherit!important;display:flex;flex-direction:column;align-items:center;padding:0}
.chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:normal}
.chip.ok{background:var(--birdie-bg);color:var(--birdie)}
.chip.bad{background:var(--bogey-bg);color:var(--dbl)}
.chip.wait{color:var(--ink)}
.chip.sm{font-size:.66rem;padding:1px 6px}
.holebar button.bad{border-color:var(--dbl);color:var(--dbl)}
.board{display:flex;flex-direction:column}
.br{display:grid;grid-template-columns:28px minmax(0,1fr) 40px 44px 52px;gap:6px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.board:has(.br span:nth-child(6)) .br{grid-template-columns:28px minmax(0,1fr) 36px 40px 48px 40px}
.br.head{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.br.me{background:var(--soft);border-radius:8px}
.br .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.br .b{font-weight:600;font-size:1.05rem}
.br>span:nth-child(n+3){text-align:right}
.gc.conflict{background:var(--bogey-bg)}
.gc.pending{opacity:.6}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.sw.ok{background:var(--surface)} .sw.pending{background:var(--surface);opacity:.5} .sw.conflict{background:var(--bogey-bg)}
.linkbox{font-size:.78rem;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere;user-select:all}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .field{min-width:0}
textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;resize:vertical}
.estat{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface)}
.estat .et{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.estat .es{font-size:.88rem;color:var(--muted)}
.estat.ok{background:var(--birdie-bg);border-color:var(--birdie)} .estat.ok .et{color:var(--birdie)}
.estat.bad{background:var(--bogey-bg);border-color:var(--dbl)} .estat.bad .et{color:var(--dbl)}
.estat.open .et{color:var(--accent)}
.enote{white-space:pre-wrap;overflow-wrap:anywhere}
.seats{display:flex;flex-direction:column}
.seat{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.seat:last-child{border-bottom:0}
.seat .t{font-weight:600;overflow-wrap:anywhere}
.seat.me{background:var(--soft);border-radius:8px}
.seat.empty{opacity:.6}
.orgp{border-style:dashed}
.chatlist{height:min(52vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;overscroll-behavior:contain}
.msg{max-width:85%;align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:7px 10px;display:flex;flex-direction:column;gap:2px}
.msg.mine{align-self:flex-end;background:var(--birdie-bg);border-radius:12px 12px 4px 12px}
.msg .mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.75rem}
.msg .mt{overflow-wrap:anywhere;white-space:pre-wrap}
.msys{align-self:center;font-size:.8rem;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 12px;text-align:center}
.cheers{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cheers .btn{flex:0 0 auto}
.cin{font:inherit;flex:1 1 160px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.chatbar .btn{flex:0 0 auto}
.mute{font-size:.8rem;display:flex;gap:6px;align-items:center}
.ubadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--dbl);color:#fff;font-size:.7rem;line-height:18px;font-family:var(--f-num)}
.seg button{font-size:.88rem}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.live b{font-family:var(--f-display);font-size:1rem}
.live .lsub{font-size:.8rem;color:var(--muted)}
.live.live{background:var(--birdie-bg);border-color:var(--birdie)} .live.live b{color:var(--birdie)}
.ldot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--muted);flex:0 0 auto;vertical-align:middle}
.ldot.sm{width:9px;height:9px}
.live.live .ldot,.ldot.live{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6)}
.live.pause .ldot,.ldot.pause{background:#eab308}
.live.done .ldot,.ldot.done{background:var(--line)}
.live.idle .ldot,.ldot.idle{background:transparent;border:2px solid var(--muted)}
@media (prefers-reduced-motion:no-preference){.live.live .ldot,.ldot.live{animation:pulse 1.6s ease-out infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}
.optin{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;padding:4px 2px}
.optin input{margin-top:4px}
details.panel summary{cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
.brand{letter-spacing:-.01em}
.brand span{color:var(--accent)}
.shprev{position:relative;margin-inline:auto;width:min(100%,360px);border-radius:16px;overflow:hidden;background:var(--soft);box-shadow:0 8px 30px rgba(0,0,0,.15)}
.shprev.\39x16{aspect-ratio:9/16;width:min(100%,300px)} .shprev.\34x5{aspect-ratio:4/5} .shprev.\31x1{aspect-ratio:1/1}
.shprev img{display:block;width:100%;height:100%;object-fit:contain}

<div id="app"><p class="muted">กำลังเปิด ParLive…</p></div>
<div id="toast" class="toast" hidden></div>

<script>
const PAR18=[4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5];
const HZ=[['sand','ทราย','ท'],['water','น้ำ','น'],['ob','OB','OB']];
/* schematic holes, all coordinates as fractions of width/height */
const SCHEM={
  3:{ar:.62,tee:{x:.5,y:.9},pin:{x:.52,y:.24},fw:[],green:{x:.52,y:.24,rx:.2,ry:.1},sand:[{x:.26,y:.3,rx:.08,ry:.04},{x:.78,y:.2,rx:.07,ry:.04}]},
  4:{ar:.55,tee:{x:.42,y:.93},pin:{x:.62,y:.11},fw:[[.42,.82],[.38,.55],[.5,.3],[.62,.15]],green:{x:.62,y:.11,rx:.16,ry:.07},sand:[{x:.22,y:.5,rx:.08,ry:.035},{x:.82,y:.14,rx:.07,ry:.03}]},
  5:{ar:.5,tee:{x:.5,y:.95},pin:{x:.4,y:.08},fw:[[.5,.86],[.62,.62],[.42,.36],[.4,.12]],green:{x:.4,y:.08,rx:.16,ry:.06},sand:[{x:.82,y:.6,rx:.08,ry:.03},{x:.2,y:.34,rx:.07,ry:.03},{x:.6,y:.09,rx:.06,ry:.025}]}
};
const app=document.getElementById('app');
let store=null, assets=null, rounds=[], courses={}, view='home', cur=null, hole=0, confirmDel=false, confirmImg=false, saveState='';
let setup=null, mapMode='shot', uploading=false;
const dirty=new Set();

/* ---------- storage ----------
   rounds: private per person (data/users/<id>), or this browser when the account cannot save.
   courses + hole maps: shared at pub/v1/* (everyone reads, only the app owner writes);
   anyone else's own edits (moved pin, their own course) are kept privately and laid over the shared ones. */
const LKEY='golf-scorebook-rounds', CKEY='golf-scorebook-courses';
let baked={}, bakedImgs={}, shared={}, mine={}, isOwner=false, privNote='';
function cid(name){let h=5381;for(const ch of name)h=((h*33)^ch.codePointAt(0))>>>0;return 'course-'+h.toString(36)+'-'+name.length}
function lread(k){try{return JSON.parse(localStorage.getItem(k)||(k===CKEY?'{}':'[]'))}catch(e){return k===CKEY?{}:[]}}
function lwrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rebuildCourses(){
  const out={};new Set([...Object.keys(baked),...Object.keys(shared),...Object.keys(mine)]).forEach(n=>{
    const c={name:n,holes:{},isShared:!!(shared[n]||baked[n])};
    [baked[n],shared[n],mine[n]].forEach(x=>{if(!x)return;Object.entries(x.holes||{}).forEach(([k,v])=>{c.holes[k]=Object.assign({},c.holes[k],v)})});
    out[n]=c;});
  courses=out;
}
function localPriv(){
  return {
    save:async r=>{const a=lread(LKEY).filter(x=>x.id!==r.id);a.push(r);lwrite(LKEY,a);rounds=a;},
    remove:async id=>{const a=lread(LKEY).filter(x=>x.id!==id);lwrite(LKEY,a);rounds=a;},
    saveCourse:async c=>{const m=lread(CKEY);m[c.name]=c;lwrite(CKEY,m);},
    saveImg:async(id,body)=>{try{localStorage.setItem('golf-img-'+id,JSON.stringify(body))}catch(e){throw {code:'quota_exceeded'}}},
    getImg:async id=>{try{const v=localStorage.getItem('golf-img-'+id);return v?JSON.parse(v):null}catch(e){return null}},
    delImg:async id=>{try{localStorage.removeItem('golf-img-'+id)}catch(e){}}};
}
function localStore(){
  rounds=lread(LKEY);mine=lread(CKEY);assets=null;rebuildCourses();
  return Object.assign({mode:'local'},localPriv());
}
async function initStore(){
  if(!(window.claude&&typeof claude.use==='function')){store=localStore();render();return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db){store=localStore();render();return}
    isOwner=user?await user.isOwner():false;
    const canWrite=user?await user.can('data.write'):null;
    gdb=db;gCan=canWrite;
    let waiting=2;const gate=()=>{if(--waiting===0&&isOwner)migrate();};
    const pubC=db.collection('pub/v1/courses'),pubI=db.collection('pub/v1/img');
    let priv;
    if(uid&&canWrite!==false){
      const col=db.collection('data/users/'+uid),imgCol=db.doc('data/users/'+uid+'/imgstore').collection('img');
      priv={mode:'db',
        save:r=>col.doc(r.id).set(r), remove:id=>col.doc(id).delete(),
        saveCourse:c=>col.doc(c.id).set(c), dropCourse:c=>col.doc(c.id).delete(),
        saveImg:(id,body)=>imgCol.doc(id).set(body),
        getImg:async id=>{const s=await imgCol.doc(id).get();return s.exists?s.data():null},
        delImg:id=>imgCol.doc(id).delete()};
      let first=true;
      col.onSnapshot(s=>{
        const rs=[],mc={};s.docs.forEach(d=>{const v=d.data();if(v.type==='course')mc[v.name]=JSON.parse(JSON.stringify(v));else rs.push(Object.assign({id:d.id},v));});
        Object.keys(mc).forEach(n=>{if(!dirty.has('m:'+n))mine[n]=mc[n];});Object.keys(mine).forEach(n=>{if(!mc[n]&&!dirty.has('m:'+n))delete mine[n];});
        rounds=rs;rebuildCourses();if(first){first=false;gate();}
        if(view==='home'||view==='setup')render();else if(view==='play')paintMapParts();
      },e=>{privNote='บันทึกในระบบไม่ได้ รอบของคุณจะเก็บไว้ในเครื่องนี้';Object.assign(store,localPriv());rounds=lread(LKEY);rebuildCourses();render();});
    }else{
      priv=localPriv();rounds=lread(LKEY);mine=lread(CKEY);
      privNote='บัญชีนี้บันทึกรอบไว้ในระบบไม่ได้ รอบของคุณจะเก็บไว้ในเบราว์เซอร์นี้เท่านั้น';gate();
    }
    let firstPub=true;
    pubC.onSnapshot(s=>{
      const sc={};s.docs.forEach(d=>{const v=d.data();if(v&&v.name)sc[v.name]=JSON.parse(JSON.stringify(v));});
      Object.keys(sc).forEach(n=>{if(!dirty.has('s:'+n))shared[n]=sc[n];});Object.keys(shared).forEach(n=>{if(!sc[n]&&!dirty.has('s:'+n))delete shared[n];});
      rebuildCourses();if(firstPub){firstPub=false;gate();}
      if(view==='home'||view==='setup')render();else if(view==='play'&&!document.querySelector('.map img'))render();
    },()=>{if(firstPub){firstPub=false;gate();}});
    store=Object.assign({mode:priv.mode||'local',
      saveShared:c=>pubC.doc(c.id).set(c),
      saveSharedImg:(id,body)=>pubI.doc(id).set(body),
      getSharedImg:async id=>{const s=await pubI.doc(id).get();return s.exists?s.data():null},
      delSharedImg:id=>pubI.doc(id).delete()},priv);
    // the owner's hole maps made before sharing existed live in their private space: publish them once
    render();
    const m=/^#g-([A-Za-z0-9]{6})$/.exec(location.hash||'');if(m)openGroup(m[1]);
  }catch(e){store=localStore();render();}
}
async function migrate(){
  const names=Object.keys(mine);if(!names.length||!store.saveShared)return;
  let moved=0;
  for(const n of names){
    const c=JSON.parse(JSON.stringify(mine[n]));const base=shared[n]||{id:cid(n),type:'course',name:n,holes:{}};
    try{
      for(const [num,h] of Object.entries(c.holes||{})){
        if(h.imgDoc){const b=await store.getImg(h.imgDoc).catch(()=>null);if(b)await store.saveSharedImg(h.imgDoc,b);}
      }
      const latest=sorted().find(r=>r.course===n);
      if(latest)latest.pars.forEach((p,i)=>{const k=i+1+(latest.start||0);c.holes[k]=Object.assign({par:p},c.holes[k]);});
      Object.entries(c.holes||{}).forEach(([k,v])=>{base.holes[k]=Object.assign({},base.holes[k],v)});
      base.id=base.id||cid(n);base.type='course';base.name=n;
      await store.saveShared(base);shared[n]=base;
      if(store.dropCourse)await store.dropCourse(c);delete mine[n];moved++;
    }catch(e){}
  }
  rebuildCourses();if(moved){toast(`แชร์ผังสนาม ${moved} สนามให้ทุกคนที่เปิดลิงก์แล้ว`);render();}
}
let chain=Promise.resolve(), timer=null; const ctimers={};
function queueSave(r){
  saveState='กำลังบันทึก…';paintSaved();
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const snap=JSON.parse(JSON.stringify(r));snap.updatedAt=Date.now();
    chain=chain.then(()=>store.save(snap)).then(()=>{saveState='บันทึกแล้ว';paintSaved();})
      .catch(err=>{saveState='';paintSaved();toast(err&&err.code==='quota_exceeded'?'พื้นที่เก็บเต็ม ลบรอบเก่าบางรอบก่อน':'บันทึกไม่สำเร็จ ลองแก้ค่าอีกครั้ง');});
  },600);
}
const writesShared=()=>isOwner&&!!(store&&store.saveShared);
// change one hole of a course; the owner edits the shared map, everyone else keeps their own overrides
function setHole(name,num,patch){
  const tgt=writesShared()?shared:mine,key=(tgt===shared?'s:':'m:')+name;
  const c=tgt[name]||(tgt[name]={id:cid(name),type:'course',name,holes:{}});
  c.holes[num]=Object.assign({},c.holes[num],patch);
  rebuildCourses();
  dirty.add(key);clearTimeout(ctimers[key]);
  ctimers[key]=setTimeout(()=>{const snap=JSON.parse(JSON.stringify(c));
    chain=chain.then(()=>tgt===shared?store.saveShared(snap):store.saveCourse(snap)).then(()=>dirty.delete(key)).catch(()=>{dirty.delete(key);toast('บันทึกข้อมูลผังสนามไม่สำเร็จ');});},500);
}
function paintSaved(){const el=document.getElementById('saved');if(el)el.textContent=saveState}

/* ---------- golf math ---------- */
const played=r=>r.scores.map((s,i)=>({...s,par:r.pars[i],i})).filter(h=>h.s!=null);
function totals(r){const p=played(r);return{n:p.length,strokes:p.reduce((a,h)=>a+h.s,0),par:p.reduce((a,h)=>a+h.par,0),putts:p.reduce((a,h)=>a+(h.p||0),0)}}
const toPar=v=>v===0?'E':(v>0?'+'+v:''+v);
const relCls=v=>v<0?'u':(v>0?'o':'');
const eff=(r,i)=>r.scores[i].s!=null?r.scores[i].s:r.pars[i];
const gir=h=>h.s!=null&&h.p!=null&&(h.s-h.p)<=h.par-2;
function roundStats(list){
  let holes=[];list.forEach(r=>holes=holes.concat(played(r)));
  const fw=holes.filter(h=>h.par>=4&&h.f);const pu=holes.filter(h=>h.p!=null);
  return{fir:fw.length?Math.round(100*fw.filter(h=>h.f==='hit').length/fw.length):null,
    gir:pu.length?Math.round(100*pu.filter(gir).length/pu.length):null,
    putts:pu.length?(pu.reduce((a,h)=>a+h.p,0)/pu.length).toFixed(2):null};
}
const fmtDate=d=>{try{return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sorted=()=>rounds.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));

/* ---------- hole map ---------- */
function holeInfo(r,i){
  const num=i+1+(r.start||0),par=r.pars[i],sch=SCHEM[par]||SCHEM[4];
  const c=courses[r.course],h=(c&&c.holes&&c.holes[num])||{};
  const img=h.imgDoc||h.img||null,ar=img?(h.ar||.6):sch.ar;
  const tee=h.tee||(img?null:sch.tee),pin=h.pin||(img?null:sch.pin);
  return {num,par,sch,img,imgDoc:h.imgDoc||null,ar,tee,pin,yd:h.yd||null};
}
const imgCache={},imgLoading={};
function loadImg(id){
  if(bakedImgs[id]){imgCache[id]=bakedImgs[id];return;}
  if(imgCache[id]||imgLoading[id])return;
  imgLoading[id]=true;
  (store.getSharedImg?store.getSharedImg(id).catch(()=>null):Promise.resolve(null)).then(b=>b&&b.data?b:store.getImg(id)).then(b=>{imgCache[id]=b&&b.data?b.data:'missing';}).catch(()=>{imgCache[id]='missing';})
    .finally(()=>{delete imgLoading[id];if(view==='play'||view==='card')render();});
}
function bgHTML(info){
  if(!info.img)return schematicSVG(info);
  if(info.imgDoc){const d=imgCache[info.imgDoc];
    if(!d&&bakedImgs[info.imgDoc])imgCache[info.imgDoc]=bakedImgs[info.imgDoc];
    const d2=imgCache[info.imgDoc];if(d2&&!d)return `<img src="${d2}" alt="ผังหลุม ${info.num}" draggable="false">`;
    if(!d){loadImg(info.imgDoc);return `<div class="imgerr" style="color:var(--muted)">กำลังโหลดรูปผังหลุม…</div>`;}
    if(d==='missing')return `${schematicSVG(info)}<div class="imgerr">หารูปผังหลุมนี้ไม่เจอ ลองอัปโหลดใหม่</div>`;
    return `<img src="${d}" alt="ผังหลุม ${info.num}" draggable="false">`;}
  return `<img src="${esc(imgSrc(info.img))}" alt="ผังหลุม ${info.num}" draggable="false" onerror="imgFail(this)"><div class="imgerr" hidden>รูปผังที่อัปโหลดด้วยเวอร์ชันก่อนเปิดไม่ได้ กด "เปลี่ยนรูปผังหลุม" เพื่ออัปโหลดใหม่</div>`;
}
function scale(info){ // yards per map unit, map units = 1000 wide
  if(!info.tee||!info.pin||!info.yd)return null;
  const W=1000,H=1000/info.ar,d=Math.hypot((info.tee.x-info.pin.x)*W,(info.tee.y-info.pin.y)*H);
  return d>5?info.yd/d:null;
}
function dist(a,b,info,k){const W=1000,H=1000/info.ar;return Math.round(Math.hypot((a.x-b.x)*W,(a.y-b.y)*H)*k)}
function schematicSVG(info){
  const W=1000,H=1000/info.ar,s=info.sch,P=p=>`${p[0]*W},${p[1]*H}`;
  let g=`<rect width="${W}" height="${H}" fill="var(--rough)"/>`;
  if(s.fw.length)g+=`<polyline points="${s.fw.map(P).join(' ')}" fill="none" stroke="var(--fw)" stroke-width="${W*.2}" stroke-linecap="round" stroke-linejoin="round"/>`;
  s.sand.forEach(b=>g+=`<ellipse cx="${b.x*W}" cy="${b.y*H}" rx="${b.rx*W}" ry="${b.ry*H}" fill="var(--sand)"/>`);
  g+=`<ellipse cx="${s.green.x*W}" cy="${s.green.y*H}" rx="${s.green.rx*W}" ry="${s.green.ry*H}" fill="var(--grn)"/>`;
  g+=`<rect x="${s.tee.x*W-60}" y="${s.tee.y*H-30}" width="120" height="60" rx="10" fill="var(--teebox)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
}
const blobUrls={};
const imgSrc=id=>blobUrls[id]||('/_blob/'+id);
function imgFail(el){el.hidden=true;const m=el.parentNode&&el.parentNode.querySelector('.imgerr');if(m)m.hidden=false;}
function overlaySVG(r,i,info){
  const W=1000,H=1000/info.ar,sc=r.scores[i],shots=(sc.shots||[]);
  const holed=!!(sc.holed&&info.pin),ready=!holed&&info.pin&&shots.length===eff(r,i)-1;
  const pts=[];if(info.tee)pts.push(info.tee);shots.forEach(p=>pts.push(p));if(holed)pts.push(info.pin);
  const X=p=>(p.x*W).toFixed(1),Y=p=>(p.y*H).toFixed(1);
  let g='';
  if(pts.length>1){const d=pts.map((p,k)=>(k?'L':'M')+X(p)+' '+Y(p)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="var(--trace-edge)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`+
       `<path d="${d}" fill="none" stroke="var(--trace)" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round" stroke-linejoin="round"/>`;}
  if(info.pin){const x=+X(info.pin),y=+Y(info.pin);
    g+=`<g class="flag ${ready?'ready':''}">`+(ready?`<circle cx="${x+20}" cy="${y-60}" r="95" fill="var(--shot)" opacity=".28"/>`:'')+
       `<circle cx="${x}" cy="${y}" r="10" fill="var(--trace)" stroke="var(--trace-edge)" stroke-width="4"/>`+
       `<line x1="${x}" y1="${y}" x2="${x}" y2="${y-110}" stroke="var(--trace)" stroke-width="7"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y-110}" stroke="var(--trace-edge)" stroke-width="2"/>`+
       `<path d="M${x} ${y-110} L${x+70} ${y-88} L${x} ${y-66} Z" fill="var(--under)" stroke="var(--trace-edge)" stroke-width="3"/></g>`;
    if(holed)g+=`<circle cx="${x-46}" cy="${y+18}" r="30" fill="var(--accent)" stroke="var(--trace-edge)" stroke-width="5"/><text x="${x-46}" y="${y+30}" text-anchor="middle" font-size="32" font-weight="700" fill="var(--accent-ink)" font-family="IBM Plex Mono,monospace">${shots.length+1}</text>`;}
  if(info.tee){g+=`<rect x="${+X(info.tee)-22}" y="${+Y(info.tee)-22}" width="44" height="44" rx="6" fill="var(--trace)" stroke="var(--trace-edge)" stroke-width="5"/><text x="${X(info.tee)}" y="${+Y(info.tee)+11}" text-anchor="middle" font-size="30" font-weight="700" fill="var(--shot-ink)" font-family="IBM Plex Mono,monospace">T</text>`;}
  shots.forEach((p,k)=>{const last=!holed&&k===shots.length-1;
    g+=`<circle cx="${X(p)}" cy="${Y(p)}" r="${last?36:30}" fill="var(--shot)" stroke="var(--trace-edge)" stroke-width="${last?7:5}"/>`+
       `<text x="${X(p)}" y="${+Y(p)+12}" text-anchor="middle" font-size="${last?36:32}" font-weight="700" fill="var(--shot-ink)" font-family="IBM Plex Mono,monospace">${k+1}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" id="${''}">${g}</svg>`;
}
function mapHTML(r,i,interactive){
  const info=holeInfo(r,i);
  const bg=bgHTML(info);
  return `<div class="map ${interactive?'tap':''}" ${interactive?'id="map"':''} style="--ar:${info.ar}">${bg}<div class="layer" ${interactive?'id="ov"':''}>${overlaySVG(r,i,info)}</div></div>`;
}
function hintText(info,r,i){
  const sc=r.scores[i],n=(sc.shots||[]).length,S=eff(r,i);
  if(mapMode==='tee')return 'แตะบนภาพตรงแท่นที';
  if(mapMode==='pin')return 'แตะบนภาพตรงธง';
  if(sc.holed)return `จบหลุมแล้ว · ${S} ไม้`;
  if(!info.pin)return 'ตั้งตำแหน่งธงก่อน (ปุ่ม "ธง")';
  if(n>=S-1)return 'แตะที่ธงเพื่อจบหลุม';
  return `แตะจุดที่ลูกไปหยุด · ช็อตที่ ${n+1} จาก ${S} (ช็อตสุดท้ายแตะธง)`;
}
function shotListHTML(r,i){
  const info=holeInfo(r,i),sc=r.scores[i],shots=sc.shots||[],k=scale(info);
  if(!shots.length&&!sc.holed)return `<div class="muted" style="font-size:.85rem">ยังไม่มีช็อตที่มาร์ค${k?'':info.img?' · ตั้งจุดที ธง และระยะหลุม เพื่อให้แอปคำนวณระยะแต่ละช็อต':' · ใส่ระยะหลุมเพื่อให้แอปคำนวณระยะแต่ละช็อต'}</div>`;
  let h=shots.map((p,j)=>{const from=j?shots[j-1]:info.tee;
    const carry=k&&from?dist(from,p,info,k):null,left=k&&info.pin?dist(p,info.pin,info,k):null;
    return `<div class="shot"><span class="dot">${j+1}</span><span>ช็อตที่ ${j+1}</span>
      <span class="d">${carry!=null?carry+' หลา':''}${left!=null?`<br><span class="muted">เหลือ ${left}</span>`:''}</span></div>`}).join('');
  if(sc.holed&&info.pin){const from=shots.length?shots[shots.length-1]:info.tee;const carry=k&&from?dist(from,info.pin,info,k):null;
    h+=`<div class="shot"><span class="dot" style="background:var(--accent);color:var(--accent-ink)">${shots.length+1}</span><span>ช็อตที่ ${shots.length+1}</span>
      <span class="d"><strong>ลงหลุม</strong>${carry!=null?`<br><span class="muted">${carry} หลา</span>`:''}</span></div>`;}
  return h;
}
function mapPanel(){
  const r=cur,i=hole,info=holeInfo(r,i),hasShots=(r.scores[i].shots||[]).length>0||!!r.scores[i].holed;
  const canUpload=!!(store&&store.saveImg);
  let imgCtl='';
  if(canUpload){

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(res=>cv.toBlob(res,'image/jpeg',.85));return {blob,ar:w/h};}
  finally{URL.revokeObjectURL(url)}
}
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    const nw=img.naturalWidth,nh=img.naturalHeight;if(!nw||!nh)throw new Error('decode');
    for(const max of [1280,1100,900,750,600]){
      const sc=Math.min(1,max/Math.max(nw,nh)),w=Math.round(nw*sc),h=Math.round(nh*sc);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      for(const q of [.72,.6,.5]){const d=cv.toDataURL('image/jpeg',q);if(d.length<200000)return {data:d,ar:w/h};}
    }
    throw new Error('big');
  }finally{URL.revokeObjectURL(url)}
}

function avgPerHole(list){let s=0,p=0,n=0;list.forEach(r=>{const t=totals(r);s+=t.strokes;p+=t.par;n+=t.n;});if(!n)return'–';const v=(s-p)/n;return (v>0?'+':'')+v.toFixed(2);}
const full18=list=>list.filter(r=>r.holes===18&&r.scores.every(x=>x.s!=null)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));
function avg18(done){
  const L=full18(done);if(!L.length)return `<span class="v">–</span><span class="muted" style="font-size:.78rem">ยังไม่มีรอบที่เล่นครบ 18 หลุม</span>`;
  const T=L.map(totals),avg=T.reduce((a,t)=>a+t.strokes,0)/T.length,par=T.reduce((a,t)=>a+t.par,0)/T.length,d=avg-par;
  return `<span class="v">${avg.toFixed(1)}</span><span class="rel num ${relCls(Math.round(d))}">${d>0?'+':''}${d.toFixed(1)} เทียบพาร์ · ${L.length} รอบ</span>`;
}
function trendChart(done){
  const L=full18(done).slice(-12);
  if(L.length<2)return'';
  const pts=L.map(r=>{const t=totals(r);return{v:t.strokes,par:t.par,d:r.date}});
  const W=340,H=170,pl=30,pr=14,pt=20,pb=24;
  const par=pts[pts.length-1].par,vals=pts.map(p=>p.v).concat([par]);
  let min=Math.floor((Math.min(...vals)-2)/5)*5,max=Math.ceil((Math.max(...vals)+2)/5)*5;
  const step=max-min>30?10:5;
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb),x=i=>pl+(pts.length===1?0:i*(W-pl-pr)/(pts.length-1));
  let g='';for(let v=min;v<=max;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(par)}" y2="${y(par)}" stroke="var(--birdie)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-pr}" y="${y(par)-5}" text-anchor="end" font-size="10" fill="var(--birdie)" font-family="IBM Plex Mono,monospace">พาร์ ${par}</text>`;
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>{const last=i===pts.length-1,c=p.v<p.par?'var(--birdie)':p.v===p.par?'var(--ink)':'var(--bogey)';
    return `<circle cx="${x(i)}" cy="${y(p.v)}" r="${last?5:3.5}" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>`+
      `<text x="${x(i)}" y="${y(p.v)-9}" text-anchor="middle" font-size="${last?11:9.5}" font-weight="${last?700:500}" fill="${last?'var(--ink)':'var(--muted)'}" font-family="IBM Plex Mono,monospace">${p.v}</text>`}).join('');
  const best=Math.min(...pts.map(p=>p.v));
  return `<div class="panel chart"><div class="top"><h2>สกอร์รวม 18 หลุม ย้อนหลัง</h2><span class="muted" style="font-size:.8rem">${pts.length} รอบล่าสุด</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟสกอร์รวม 18 หลุม ${pts.length} รอบล่าสุด">${g}
  <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round" opacity=".55"/>${dots}
  <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtDate(pts[0].d)}</text><text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtDate(pts[pts.length-1].d)}</text></svg>
  <div class="muted" style="font-size:.8rem">นับเฉพาะรอบที่เล่นครบ 18 หลุม · ดีที่สุดในช่วงนี้ ${best}</div></div>`;
}

function holesOf(list){let h=[];list.forEach(r=>h=h.concat(played(r)));return h}
function metricVal(k,H){
  const n=H.length;if(!n)return null;const per18=18/n;
  const withP=H.filter(h=>h.p!=null);
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  switch(k){
    case 'fir':{const a=H.filter(h=>h.par>=4&&h.f);return a.length>=4?{v:100*a.filter(h=>h.f==='hit').length/a.length,d:`${a.filter(h=>h.f==='hit').length}/${a.length}`}:null}
    case 'gir':return withP.length>=4?{v:100*withP.filter(gir).length/withP.length,d:`${withP.filter(gir).length}/${withP.length}`}:null;
    case 'putts':return withP.length>=4?{v:avg(withP.map(h=>h.p))}:null;
    case 'three':return withP.length>=6?{v:withP.filter(h=>h.p>=3).length*18/withP.length,d:`${withP.filter(h=>h.p>=3).length} ครั้ง`}:null;
    case 'scr':{const a=withP.filter(h=>!gir(h));return a.length>=3?{v:100*a.filter(h=>h.s<=h.par).length/a.length,d:`${a.filter(h=>h.s<=h.par).length}/${a.length}`}:null}
    case 'p3':case 'p4':case 'p5':{const a=H.filter(h=>h.par===+k[1]);return a.length>=2?{v:avg(a.map(h=>h.s-h.par)),d:`${a.length} หลุม`}:null}
    case 'blow':return n>=6?{v:H.filter(h=>h.s-h.par>=2).length*per18,d:`${H.filter(h=>h.s-h.par>=2).length} หลุม`}:null;
    case 'sand':return n>=6?{v:H.filter(h=>(h.hz||[]).includes('sand')).length*per18,d:`${H.filter(h=>(h.hz||[]).includes('sand')).length} ครั้ง`}:null;
    case 'pen':{const c=H.filter(h=>(h.hz||[]).some(x=>x==='water'||x==='ob')).length;return n>=6?{v:c*per18,d:`${c} ครั้ง`}:null}
  }
  return null;
}
function analyze(r){
  const H=holesOf([r]);if(H.length<6)return null;

  const own=others.length>=2?holesOf(others):null;
  const items=[];
  MET.forEach(m=>{const cur=metricVal(m.k,H);if(!cur)return;
    let ref=m.ref,refLab='เกณฑ์';
    if(own){const o=metricVal(m.k,own);if(o){ref=o.v;refLab='เฉลี่ยคุณ';}}

  const good=items.filter(x=>!x.m.badOnly&&x.z>=.4).sort((a,b)=>b.z-a.z).slice(0,2);
  const bad=items.filter(x=>x.z<=-.4).sort((a,b)=>a.z-b.z).slice(0,3);

  return {good,bad,note,own:!!own,nOwn:others.length,items:items.length};
}

    if(k&&x.holed&&info.pin){const from=(x.shots||[]).length?x.shots[x.shots.length-1]:info.tee;parts.push((from?dist(from,info.pin,info,k)+'y ':'')+'ลงหลุม');}

  return s.trim();
}

    else if(seats.length<e.cap)h+=`<div class="panel"><div class="field"><label class="label" for="ename">ชื่อของคุณ</label><input id="ename" maxlength="40" autocomplete="off" value="${esc(getLastName())}"></div><button class="btn primary full" data-act="ejoin">ลงชื่อออกรอบ</button><div class="muted" style="font-size:.8rem">ลงได้เครื่องละ 1 ชื่อ แก้ไขหรือยกเลิกได้เฉพาะชื่อของตัวเอง</div></div>`;
    else h+=`<div class="notice">นัดนี้เต็มแล้ว ถ้ามีคนยกเลิก ที่ว่างจะกลับมาให้ลงชื่อได้</div>`;
  }else if(mine&&(ph==='closed'||ph==='confirmed'))h+=`<div class="muted" style="font-size:.85rem;text-align:center">คุณอยู่ในรายชื่อนัดนี้ ถ้าไปไม่ได้ ติดต่อผู้นัดโดยตรง</div>`;
  if(ph!=='cancelled')h+=`<div class="row"><button class="btn" data-act="eics">เพิ่มลงปฏิทิน</button><button class="btn" data-act="esum">คัดลอกสรุปส่ง LINE</button></div>`;
  // organizer tools
  if(org){
    h+=`<div class="panel orgp"><h2>สำหรับผู้นัด</h2>`;
    if(ph==='closed'||ph==='open'||ph==='soon')h+=`<div class="row"><button class="btn primary" data-act="econfirm" ${seats.length<2?'disabled':''}>ยืนยันออกรอบ</button><button class="btn danger" data-act="ecancelask">ยกเลิกนัด</button></div>`;
    if(ph==='confirmed')h+=`<button class="btn primary full" data-act="egroup">เริ่มก๊วนจากนัดนี้ (${seats.length} คน)</button><button class="btn full" data-act="ereopen">ย้อนกลับเป็นรอสรุป</button><button class="btn danger full" data-act="ecancelask">ยกเลิกนัด</button>`;
    if(ph==='cancelled')h+=`<button class="btn full" data-act="ereopen">เปิดนัดนี้ใหม่</button>`;
    if(eConfirmCancel)h+=`<div class="confirm"><strong>ยกเลิกนัดนี้?</strong><div class="seg">${['ฝนตก','คนไม่ครบ','สนามปิด','อื่น ๆ'].map(r=>`<button data-act="ecancel" data-r="${r}">${r}</button>`).join('')}</div><button class="btn" data-act="ecancelno">ไม่ยกเลิก</button></div>`;
    h+=(eDelAsk?`<div class="confirm"><strong>ลบนัดนี้ถาวร?</strong><span class="muted">รายชื่อผู้ลงชื่อจะหายทั้งหมด และลิงก์นัดจะเปิดไม่ได้</span><div class="row"><button class="btn" data-act="edelno">ไม่ลบ</button><button class="btn danger" data-act="edelyes">ลบนัด</button></div></div>`
      :`<button class="btn danger full" data-act="edelask">ลบนัดนี้</button>`);
    h+=`<button class="btn full" data-act="eedit">แก้ไข / เลื่อนวันเวลา</button>
      <div class="muted" style="font-size:.8rem">เฉพาะเครื่องนี้ที่เป็นผู้นัด ถ้าล้างข้อมูลเบราว์เซอร์หรือเปลี่ยนเครื่อง จะจัดการนัดนี้ไม่ได้</div></div>`;
  }
  return h;
}
function getLastName(){try{return localStorage.getItem('golf-myname')||''}catch(e){return''}}

function eSummary(e){const s=seatList(e),ph=ePhase(e);
  const st={cancelled:'❌ ยกเลิก'+(e.cancelReason?` (${e.cancelReason})`:''),confirmed:'✅ ยืนยันออกรอบ',open:`📝 เปิดรับ เหลือ ${e.cap-s.length} ที่ ปิดรับ ${thDT(e.closeAt)}`,closed:'⏳ ปิดรับแล้ว รอสรุป',soon:`🕒 เปิดรับ ${thDT(e.openAt)}`}[ph];
  return `⛳ ${e.course}\n📅 ${thDate(e.date)} ทีออฟ ${e.time} น.\n${st}\n\n${s.map((x,i)=>`${i+1}. ${x.name}`).join('\n')||'(ยังไม่มีคนลงชื่อ)'}${e.note?`\n\n${e.note}`:''}\n\nลงชื่อ/ดูสถานะ: ${baseUrl()}?e=${e.id}`;}
function eIcs(e){

  const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//golf-scorebook//TH','BEGIN:VEVENT',`UID:${e.id}@golf-scorebook`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(st)}`,`DTEND:${f(en)}`,
    `SUMMARY:ออกรอบกอล์ฟ ${e.course}`,`DESCRIPTION:${(e.note||'').replace(/\n/g,'\\n')}\\n${baseUrl()}?e=${e.id}`,`LOCATION:${e.course}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(t);a.download='golf-'+e.date+'.ics';document.body.appendChild(a);a.click();a.remove();}
function copyText(t,msg){try{navigator.clipboard.writeText(t).then(()=>toast(msg),()=>fallbackCopy(t))}catch(x){fallbackCopy(t)}}

/* ---------- ห้องเชียร์ ----------
   groups/<CODE>/chat/<id> = {uid, name, role 'p'|'v', text, at}
   Players only ever see an unread count on the tab: no toast, sound or vibration. */
let GC=[],chatLastSend=0;
const CHEERS=['👏 สวย!','⛳ ลงเลย','🔥 ร้อนแรง','💪 สู้ ๆ','😂 555'];
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const chatSeenKey=()=>'golf-chatseen-'+G.code, chatMuteKey=()=>'golf-chatmute-'+G.code;
function chatName(){if(!gRO&&gMe&&gMe!=='watch')return pName(gMe);return lsGet('golf-chatname','')}
const chatRole=()=>(!gRO&&gMe&&gMe!=='watch')?'p':'v';
const chatOwner=()=>G&&gdb&&G.owner===gdb.uid();
function chatClosedForDay(){if(!G||!G.date)return false;return Date.now()>new Date(G.date+'T23:59:59+07:00').getTime()+86400000}
const chatLocked=()=>!!(G&&G.chatLocked)||chatClosedForDay();
// verified birdies or better become feed items; first-seen time kept per device so the timeline stays stable
function chatHighlights(){
  if(!G||!G.pars)return[];const k='golf-hl-'+G.code;let seen={};try{seen=JSON.parse(lsGet(k,'{}'))}catch(e){}
  const out=[];let changed=false;
  G.players.forEach(p=>G.pars.forEach((par,i)=>{const s=hStat(p.id,i);if(s.st!=='ok'||s.val==null)return;const d=s.val-par;if(d>-1)return;
    const id=p.id+'-'+gNum(i)+'-'+s.val;if(!seen[id]){seen[id]=Date.now();changed=true;}
    out.push({sys:true,at:seen[id],text:`${d<=-2?'🦅':'🐦'} ${p.name} ${diffName(d)} หลุม ${gNum(i)}`});}));
  if(changed)lsSet(k,JSON.stringify(seen));return out;
}
function chatItems(){const m=GC.map(x=>Object.assign({},x));return m.concat(chatHighlights()).sort((a,b)=>a.at-b.at)}
function chatUnread(){if(!G)return 0;const seen=+lsGet(chatSeenKey(),0),me=gdb&&gdb.uid();return GC.filter(m=>m.at>seen&&m.uid!==me).length}
function chatMarkSeen(){if(G&&GC.length)lsSet(chatSeenKey(),String(Math.max(...GC.map(m=>m.at))))}
const hhmm=ms=>new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
function gChatView(){
  chatMarkSeen();
  const me=gdb&&gdb.uid(),own=chatOwner(),items=chatItems(),name=chatName(),locked=chatLocked();
  let h=`<div class="panel chatp"><div class="top"><h2>ห้องเชียร์</h2><span class="muted" style="font-size:.78rem">${GC.length} ข้อความ</span></div>
    <div class="chatlist" id="chatlist">${items.length?items.map(m=>m.sys?`<div class="msys">${esc(m.text)} <span class="muted">${hhmm(m.at)}</span></div>`:
      `<div class="msg ${m.uid===me?'mine':''}"><div class="mh"><b>${esc(m.name)}</b>${m.role==='p'?'<span class="chip ok sm">ผู้เล่น</span>':''}<span class="muted">${hhmm(m.at)}</span>${(m.uid===me||own)?`<button class="linkbtn" data-act="cdel" data-id="${esc(m.id)}">ลบ</button>`:''}</div><div class="mt">${esc(m.text)}</div></div>`).join('')
      :'<div class="muted" style="text-align:center;padding:24px 0">ยังไม่มีข้อความ เริ่มเชียร์ได้เลย</div>'}</div>`;
  if(locked)h+=`<div class="notice">${chatClosedForDay()?'จบวันแข่งแล้ว ห้องเชียร์เปิดให้อ่านย้อนหลังอย่างเดียว':'ผู้สร้างก๊วนปิดห้องเชียร์ชั่วคราว'}</div>`;
  else if(!name)h+=`<div class="field"><label class="label" for="chatname">ชื่อที่จะแสดงในห้องเชียร์</label><div class="row"><input id="chatname" class="cin" maxlength="30" autocomplete="off" placeholder="เช่น แฟนคลับบอย"><button class="btn primary" data-act="cname">ตกลง</button></div></div>`;
  else h+=`<div class="cheers">${CHEERS.map(c=>`<button class="btn sm" data-act="ccheer" data-t="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="row chatbar"><input id="chatin" class="cin" maxlength="200" autocomplete="off" placeholder="พิมพ์ในนาม ${esc(name)}…" enterkeyhint="send"><button class="btn primary" data-act="csend">ส่ง</button></div>
    ${chatRole()==='v'?`<div class="muted" style="font-size:.75rem">แสดงชื่อว่า ${esc(name)} · <button class="linkbtn" data-act="crename">เปลี่ยนชื่อ</button></div>`:''}`;
  if(chatRole()==='p')h+=`<label class="muted mute"><input type="checkbox" id="chatmute" ${lsGet(chatMuteKey(),'')?'checked':''}> ไม่ต้องแสดงตัวเลขข้อความใหม่บนแท็บ</label>`;
  if(own)h+=`<div class="row"><button class="btn sm" data-act="clock">${G.chatLocked?'เปิดห้องเชียร์':'ปิดห้องเชียร์ชั่วคราว'}</button><button class="btn sm" data-act="cslow" aria-pressed="${!!G.chatSlow}">${G.chatSlow?'ปิดโหมดช้า':'โหมดช้า (10 วินาที)'}</button></div>`;

function chatSend(text){
  text=String(text||'').trim().slice(0,200);if(!text)return;
  if(chatLocked()){toast('ห้องเชียร์ปิดอยู่');return}
  const wait=(G.chatSlow?10000:1500)-(Date.now()-chatLastSend);if(wait>0){toast(`รออีก ${Math.ceil(wait/1000)} วินาที`);return}

  chatLastSend=Date.now();const inp=document.getElementById('chatin');if(inp)inp.value='';
  gdb.authReady.then(u=>{if(!u)throw{code:'auth'};return gdb.doc('groups/'+G.code).add('chat',{uid:u.uid,name,role:chatRole(),text})})
    .catch(e=>{console.error(e);toast(e&&e.code==='permission-denied'?'ส่งไม่ได้ ห้องเชียร์อาจปิดอยู่':'ส่งข้อความไม่สำเร็จ');});

function chatClick(a,b){

  if(a==='crename'){lsSet('golf-chatname','');render();return true}
  if(a==='cdel'){gdb.doc(`groups/${G.code}/chat/${b.dataset.id}`).remove().catch(()=>toast('ลบไม่สำเร็จ'));return true}
  if(a==='clock'&&chatOwner()){gdb.doc('groups/'+G.code).set({chatLocked:!G.chatLocked},true);return true}

/* ---------- LIVE status, viewers, lobby ----------
   groups/<CODE>.last / .thru : touched by players at most once a minute while scoring
   groups/<CODE>/watch/<uid>  : viewer heartbeat (every minute while the page is visible)
   live/<CODE>                : public lobby card, only for groups whose owner ticked "public" */
const tsMs=v=>!v?0:typeof v==='number'?v:v.toMillis?v.toMillis():v.seconds?v.seconds*1000:0;
function gAllDone(){return G&&G.players&&G.players.every(p=>G.pars.every((x,i)=>hStat(p.id,i).val!=null))}
function gThru(){if(!G||!G.pars)return 0;let m=0;G.pars.forEach((x,i)=>{if(G.players.some(p=>hStat(p.id,i).val!=null))m=i+1;});return m}
function liveState(last,ended,started){
  const age=Date.now()-tsMs(last);
  if(ended)return{k:'done',dot:'⚪',t:'จบรอบแล้ว'};
  if(!started||!tsMs(last))return{k:'idle',dot:'◯',t:'ยังไม่เริ่ม'};
  if(age<30*60000)return{k:'live',dot:'🟢',t:'LIVE · กำลังออกรอบ'};
  return{k:'pause',dot:'🟡',t:'พักอยู่'};
}
const ago=ms=>{const m=Math.round((Date.now()-ms)/60000);return m<1?'เมื่อสักครู่':m<60?`${m} นาทีที่แล้ว`:`${Math.floor(m/60)} ชม. ${m%60} นาทีที่แล้ว`};
function gLive(){const t=gThru();return liveState(G.last,G.ended||gAllDone(),t>0)}
function liveBadge(){
  const s=gLive(),t=gThru(),last=tsMs(G.last);
  const sub=s.k==='live'?`หลุม ${gNum(Math.max(0,t-1))} · อัปเดต ${ago(last)}`:s.k==='pause'?`อัปเดตล่าสุด ${ago(last)}`:s.k==='done'?`เล่นถึงหลุม ${t?gNum(t-1):'-'}`:'รอผู้เล่นกรอกสกอร์หลุมแรก';
  return `<div class="live ${s.k}"><span class="ldot"></span><b>${s.t}</b><span class="lsub">${sub}</span>${gWatchers!=null&&s.k!=='done'?`<span class="lsub">👀 ${gWatchers} คนกำลังดู</span>`:''}</div>`;
}
let gDelAsk=false,gDeleting=false,gTouchAt=0,gWatchers=null,gHB=null;
function gTouch(){
  if(!G||gRO||Date.now()-gTouchAt<45000)return;gTouchAt=Date.now();
  const thru=gThru(),code=G.code;
  gdb.doc('groups/'+code).stamp({thru},'last').catch(()=>{});
  if(G.public)liveCard(false);
}
// remove temporary docs (viewer pings, lobby card) once a round is over; only the owner may delete other people's pings
async function gCleanup(code){
  try{const ref=gdb.doc('groups/'+code);const ids=await ref.ids('watch');
    for(let i=0;i<ids.length;i+=20)await Promise.all(ids.slice(i,i+20).map(id=>gdb.doc(`groups/${code}/watch/${id}`).remove().catch(()=>{})));
    await gdb.doc('live/'+code).remove().catch(()=>{});
    await ref.set({cleaned:true},true).catch(()=>{});
  }catch(e){console.error(e)}
}
// a viewer leaving removes their own ping right away
function gLeaveWatch(code){const u=gdb&&gdb.uid();if(u&&code)gdb.doc(`groups/${code}/watch/${u}`).remove().catch(()=>{});}
async function gDeleteGroup(){
  const code=G.code,ref=gdb.doc('groups/'+code);gDeleting=true;render();
  gUnsub.forEach(u=>{try{u()}catch(e){}});gUnsub=[];clearInterval(gHB);
  try{
    for(const c of ['scores','chat','members','watch']){const ids=await ref.ids(c);
      for(let i=0;i<ids.length;i+=20)await Promise.all(ids.slice(i,i+20).map(id=>gdb.doc(`groups/${code}/${c}/${id}`).remove()));}
    await gdb.doc('live/'+code).remove().catch(()=>{});
    await gdb.doc('groupKeys/'+code).remove().catch(()=>{});
    await ref.remove();
    try{localStorage.setItem(GKEY,JSON.stringify(myGroups().filter(x=>x.code!==code)));['golf-gk-','golf-g-me-','golf-chatseen-','golf-chatmute-','golf-hl-'].forEach(k=>localStorage.removeItem(k+code));}catch(e){}
    gStop();G=null;gDelAsk=false;gDeleting=false;view='groups';render();toast('ลบก๊วนแล้ว');
  }catch(e){console.error(e);gDeleting=false;render();toast('ลบไม่ครบ ลองกดลบอีกครั้ง');}
}
function liveCard(ended){
  if(!G||!G.public)return;const rows=gRows().filter(r=>r.thru).sort((a,b)=>a.toPar-b.toPar);
  const lead=rows[0];
  if(G.archived)return;

function scoreColumns(c,src,x,y,w,h,dark){

let gdb=null,gCan=null,G=null,GS={},gUnsub=[],gTab='hole',gHole=0,gMe=null,gNew=null,gRO=false;

function mergeDeep(t,p){Object.entries(p).forEach(([k,v])=>{if(v&&typeof v==='object'&&!Array.isArray(v)){t[k]=t[k]&&typeof t[k]==='object'?t[k]:{};mergeDeep(t[k],v);}else t[k]=v;});return t}
const gq={};
function gPatch(pid,patch){
  const code=G.code;const q=gq[pid]&&gq[pid].code===code?gq[pid]:(gq[pid]={code,patch:{},busy:false,t:null});
  mergeDeep(q.patch,patch);mergeDeep(GS[pid]=GS[pid]||{},patch);
  clearTimeout(q.t);q.t=setTimeout(()=>gFlush(pid),350);
}
async function gFlush(pid){
  const q=gq[pid];if(!q||q.busy)return;q.busy=true;
  while(Object.keys(q.patch).length){const p=q.patch;q.patch={};
    // saved to this phone at once and sent when there is signal
    gdb.doc(`groups/${q.code}/scores/${pid}`).set(p,true).catch(e=>{
      if(e&&e.code==='permission-denied'){gRO=true;toast('ลิงก์นี้เป็นลิงก์ผู้ชม กรอกสกอร์ไม่ได้');render();}else toast('ส่งสกอร์ไม่สำเร็จ');});
    gTouch();

}
const gPar=i=>G.pars[i];
const gNum=i=>i+1+(G.start||0);
function gEntries(pid,i){const h=GS[pid]&&GS[pid].h&&GS[pid].h[String(gNum(i))];return h?Object.entries(h).filter(([,v])=>v!=null):[]}
function hStat(pid,i){
  const e=gEntries(pid,i);if(!e.length)return{st:'none',val:null,e};
  const vals=new Set(e.map(x=>x[1]));const self=e.find(x=>x[0]===pid);
  if(vals.size>1)return{st:'conflict',val:self?self[1]:e[0][1],e};
  return{st:e.length>=2?'ok':'pending',val:e[0][1],e};
}
const pName=id=>{const p=(G.players||[]).find(x=>x.id===id);return p?p.name:'?'};
function gRows(){
  return (G.players||[]).map(p=>{

    G.pars.forEach((pp,i)=>{const s=hStat(p.id,i);if(s.val!=null){g+=s.val;par+=pp;thru++;}if(s.st==='conflict')conf++;if(s.st==='pending')pend++;});
    const hcp=+p.hcp||0,net=thru?g-Math.round(hcp*thru/G.pars.length):0;

}

function stChip(s,pid){
  if(s.st==='ok')return `<span class="chip ok">✓ ตรงกัน ${s.e.length} คน</span>`;
  if(s.st==='conflict')return `<span class="chip bad">ไม่ตรง: ${s.e.map(([w,v])=>`${esc(w===pid?'ตัวเอง':pName(w))} ${v}`).join(' · ')}</span>`;
  if(s.st==='pending')return `<span class="chip wait">รอคนยืนยัน · ${esc(s.e[0][0]===pid?'ตัวเองกรอก':pName(s.e[0][0])+'กรอก')}</span>`;
  return `<span class="chip">ยังไม่มีคนกรอก</span>`;
}

function gCardView(){
  const N=G.pars.length,st0=G.start||0,idx=[...Array(N).keys()];
  const parts=N===18?[['OUT',idx.slice(0,9)],['IN',idx.slice(9)]]:[[st0?'IN':'OUT',idx]];
  let head='<th>ผู้เล่น</th>',par='<td>Par</td>';
  parts.forEach(([l,ii])=>{ii.forEach(i=>{head+=`<th>${gNum(i)}</th>`;par+=`<td>${G.pars[i]}</td>`});head+=`<th class="sum">${l}</th>`;par+=`<td class="sum">${ii.reduce((a,i)=>a+G.pars[i],0)}</td>`;});
  if(N===18){head+='<th class="sum">รวม</th>';par+=`<td class="sum">${G.pars.reduce((a,b)=>a+b,0)}</td>`;}
  const rows=G.players.map(p=>{let tr=`<td>${esc(p.name)}</td>`,tot=0;
    parts.forEach(([l,ii])=>{let sub=0;ii.forEach(i=>{const s=hStat(p.id,i);if(s.val!=null)sub+=s.val;
      tr+=`<td class="gc ${s.st}">${s.val!=null?mark(s.val,G.pars[i]):''}</td>`;});tot+=sub;tr+=`<td class="sum">${sub||''}</td>`;});
    if(N===18)tr+=`<td class="sum">${tot||''}</td>`;return `<tr>${tr}</tr>`}).join('');
  return `<div class="cardwrap"><table class="sc"><thead><tr>${head}</tr></thead><tbody><tr>${par}</tr>${rows}</tbody></table></div>
  <div class="legend"><span><span class="sw ok"></span>ตรงกันแล้ว</span><span><span class="sw pending"></span>รอยืนยัน</span><span><span class="sw conflict"></span>ค่าไม่ตรงกัน</span></div>
  <div class="legend"><span><span class="mk e">3</span>อีเกิล</span><span><span class="mk b">3</span>เบอร์ดี้</span><span><span class="mk bo">5</span>โบกี้</span><span><span class="mk db">6</span>ดับเบิลขึ้นไป</span></div>`;
}
function gWrite(pid,val){

  const sig=GS[pid]&&GS[pid].sig;if(sig&&Object.keys(sig).some(k=>sig[k])){patch.sig={};Object.keys(sig).forEach(k=>patch.sig[k]=null);}
  gPatch(pid,patch);render();
}

      if(GL[G.code])GL[G.code].archived=on;toast(on?'เก็บเข้าคลังแล้ว':'เอาออกจากคลังแล้ว');render();});return true}
  if(a==='gdelask'){gDelAsk=true;render();return true}

  return false;
}

function newRound(){
  const last=sorted()[0];
  const firstShared=Object.keys(courses).find(n=>courses[n].isShared);
  const c0=last?last.course:(firstShared||'');
  setup={course:c0,date:today(),holes:18,start:0,pars:parsFor(c0,18,0)};
  view='setup';render();
}
function parsFor(course,holes,start){
  const c=courses[course];
  if(c){const a=[];for(let i=0;i<holes;i++){const h=c.holes[i+1+start];a.push(h&&h.par?h.par:null);}
    if(a.every(x=>x)) return a;}
  const m=sorted().find(r=>r.course===course&&r.holes===holes&&(r.start||0)===start)||sorted().find(r=>r.course===course&&r.holes===18);
  if(m)return m.holes===holes?m.pars.slice():m.pars.slice(start,start+holes);
  return PAR18.slice(start,start+holes);
}

      if(left<=0){
        if(!info.pin){toast('ตั้งตำแหน่งธงก่อน แล้วแตะธงเพื่อจบหลุม');return}
        if(!onFlag){toast(`ครบ ${S-1} ช็อตแล้ว แตะที่ธงเพื่อจบหลุม`);return}
        if(s.s==null)s.s=S;s.holed=true;queueSave(cur);paintMapParts();toast(`จบหลุม ${num} · ${diffName(s.s-cur.pars[hole])}`);return;
      }
      if(s.s==null)s.s=S;s.shots.push({x:p.x,y:p.y});queueSave(cur);if(left===S-1)render();
      if(left===1)toast('ช็อตต่อไปลงหลุม แตะที่ธงเพื่อจบหลุม');
    }
    else{setHole(cur.course,num,{[mapMode]:p});
      if(mapMode==='tee'&&!holeInfo(cur,hole).pin){mapMode='pin';}else mapMode='shot';}
    paintMapParts();return;
  }
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='new')return newRound();
  if(shareClick(a,b))return;
  if(a==='sharecard'&&cur){openShare(srcFromRound(cur));return}
  if(a==='homecard'){const r=sorted().find(r=>totals(r).n>0);if(r){cur=JSON.parse(JSON.stringify(r));openShare(srcFromRound(cur));}return}
  if(a==='bimport'){document.getElementById('bfile').click();return}
  if(a==='bexport'){exportRounds();return}
  if(a==='homecardhelp'){toast('ยังไม่มีรอบในเครื่องนี้ กด "เริ่มรอบใหม่" หรือสร้างการ์ดจากแท็บอันดับในก๊วน');return}
  if(a==='gsharecard'&&G&&gMe){openShare(srcFromGroup(gMe));return}
  if(a==='gresultcard'&&G){openShare(srcGroupResult());return}
  if(eClick(a,b))return;
  if(gClick(a,b))return;
  if(a==='home'){gStop();eStop();E=null;G=null;view='home';cur=null;confirmDel=false;return render();}
  if(a==='resume'||a==='open'){const r=rounds.find(x=>x.id===b.dataset.id);if(!r)return;cur=JSON.parse(JSON.stringify(r));confirmDel=false;mapMode='shot';
    if(a==='resume'||!r.complete){hole=Math.max(0,cur.scores.findIndex(x=>x.s==null));view='play';}else view='card';saveState='';return render();}
  if(view==='setup'){
    readSetupFields();
    if(a==='holes'){const n=b.dataset.n;setup.holes=n==='18'?18:9;setup.start=n==='9b'?9:0;setup.pars=parsFor(setup.course,setup.holes,setup.start);return render();}
    if(a==='cyclepar'){const i=+b.dataset.i;setup.pars[i]=setup.pars[i]===5?3:setup.pars[i]+1;return render();}
    if(a==='start'){if(!setup.course){toast('ใส่ชื่อสนามก่อนเริ่มรอบ');document.getElementById('course').focus();return}
      cur={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),course:setup.course,date:setup.date,holes:setup.holes,start:setup.start,
        pars:setup.pars.slice(),scores:setup.pars.map(()=>({s:null,p:null,f:null,hz:[],shots:[]})),complete:false,createdAt:Date.now()};
      const known=courses[cur.course];
      if(writesShared()||!known||!known.isShared)cur.pars.forEach((p,i)=>{const k=i+1+cur.start;if(!known||!known.holes[k]||known.holes[k].par!==p)setHole(cur.course,k,{par:p});});
      hole=0;mapMode='shot';view='play';saveState='';queueSave(cur);return render();}
  }
  if(view==='play'){
    const s=cur.scores[hole],par=cur.pars[hole];
    const move=i=>{hole=i;mapMode='shot';confirmImg=false;render();window.scrollTo({top:0})};
    if(a==='go')return move(+b.dataset.i);
    if(a==='prev'&&hole>0)return move(hole-1);
    if(a==='next'){if(s.s==null){s.s=par;queueSave(cur);}return move(Math.min(cur.holes-1,hole+1));}
    if(a==='card'){view='card';return render();}
    if(a==='finish'){if(s.s==null){s.s=par;queueSave(cur);}const miss=cur.scores.filter(x=>x.s==null).length;
      if(miss){toast(`ยังไม่ได้ใส่สกอร์ ${miss} หลุม`);return move(cur.scores.findIndex(x=>x.s==null));}
      cur.complete=true;queueSave(cur);view='card';toast('จบรอบแล้ว');return render();}
    if(a==='mode'){mapMode=b.dataset.m;return paintMapParts();}
    if(a==='undo'){if(s.holed)s.holed=false;else (s.shots||[]).pop();queueSave(cur);return paintMapParts();}
    if(a==='clearshots'){s.shots=[];s.holed=false;queueSave(cur);return paintMapParts();}
    if(a==='pickimg'){document.getElementById('holeimg').click();return}
    if(a==='rmimg'){confirmImg=true;return render();}
    if(a==='noimg'){confirmImg=false;return render();}
    if(a==='doimg'){const num=hole+1+(cur.start||0),old=(courses[cur.course]&&courses[cur.course].holes[num])||{};
      setHole(cur.course,num,{img:null,imgDoc:null,tee:null,pin:null});confirmImg=false;
      if(old.imgDoc){if(writesShared())store.delSharedImg(old.imgDoc).catch(()=>{});else store.delImg(old.imgDoc).catch(()=>{});}toast('ลบรูปแล้ว กลับไปใช้ผังจำลอง');return render();}
    let changed=false;
    if(a==='setpar'){cur.pars[hole]=+b.dataset.p;setHole(cur.course,hole+1+(cur.start||0),{par:cur.pars[hole]});if(cur.pars[hole]<4)s.f=null;changed=true;}
    if(a==='inc'||a==='dec'){const k=b.dataset.k,d=a==='inc'?1:-1;
      if(k==='s'){const nv=Math.max(1,(s.s==null?par:s.s)+d);const need=(s.shots||[]).length+(s.holed?1:0);
        if(nv<need){toast('มาร์คจุดไว้มากกว่าสกอร์นี้ กด "ลบช็อตล่าสุด" ก่อนลดสกอร์');return}
        if(s.holed&&nv>s.s){s.holed=false;toast('เพิ่มสกอร์แล้ว มาร์คช็อตที่เพิ่มแล้วแตะธงอีกครั้ง');}
        s.s=nv;if(s.p!=null&&s.p>s.s)s.p=s.s;}
      if(k==='p'){if(s.s==null)s.s=par;s.p=s.p==null?(d>0?2:1):Math.max(0,s.p+d);if(s.p>s.s)s.p=s.s;}
      changed=true;}
    if(a==='fw'){const v=b.dataset.f,on=v==='hit'?s.f==='hit':(!!s.f&&s.f!=='hit');s.f=on?null:v;if(s.s==null)s.s=par;changed=true;}
    if(a==='hz'){const h=b.dataset.h,l=(s.hz||[]).slice(),j=l.indexOf(h);if(j>=0)l.splice(j,1);else l.push(h);s.hz=l;if(s.s==null)s.s=par;changed=true;}
    if(changed){queueSave(cur);return render();}
  }
  if(view==='card'){
    if(a==='edit'){hole=0;mapMode='shot';view='play';return render();}
    if(a==='gohole'){hole=+b.dataset.i;mapMode='shot';view='play';render();window.scrollTo({top:0});return}
    if(a==='copy'){const txt=cardText(cur);try{navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกสกอร์การ์ดแล้ว'),()=>fallbackCopy(txt))}catch(err){fallbackCopy(txt)}return;}
    if(a==='del'){confirmDel=true;return render();}
    if(a==='nodel'){confirmDel=false;return render();}
    if(a==='dodel'){const id=cur.id;clearTimeout(timer);chain=chain.then(()=>store.remove(id)).then(()=>toast('ลบรอบแล้ว')).catch(()=>toast('ลบไม่สำเร็จ ลองอีกครั้ง'));
      rounds=rounds.filter(x=>x.id!==id);cur=null;confirmDel=false;view='home';return render();}
  }
});
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);toast(ok?'คัดลอกสกอร์การ์ดแล้ว':'คัดลอกไม่ได้ในหน้าจอนี้');}
let tt=null;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600);}

// course maps published with the page, so anyone with the link sees them without signing in
fetch('courses.json').then(r=>r.ok?r.json():null).then(j=>{
  if(!j)return;(j.courses||[]).forEach(c=>{baked[c.name]=c;});bakedImgs=j.images||{};
  rebuildCourses();if(store)render();
}).catch(()=>{});
initStore();
window.addEventListener('pagehide',()=>{if(view==='group'&&G&&G.code)gLeaveWatch(G.code);});
setInterval(()=>{if(view==='group'&&G&&!G.loading&&!G.missing&&document.getElementById('chatin')!==document.activeElement)render();},30000);
initFirebase().then(fb=>{gdb=fb;if(view==='home'){loadLobby(true);}
  const q=new URLSearchParams(location.search),g=(q.get('g')||'').toUpperCase(),k=q.get('k');
  const ev=q.get('e');
  if(g){if(k){setKey(g,k);try{history.replaceState(null,'',baseUrl()+'?g='+g)}catch(e){}}openGroup(g,k);}
  else if(ev&&/^[a-z0-9]{8}$/.test(ev))openEvent(ev);
  else if(view==='groups'||view==='events')render();
}).catch(e=>{fbErr='load';console.error(e);if(view==='groups'||view==='events')render();});
</script>
